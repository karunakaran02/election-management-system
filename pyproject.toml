[project]
name = "polling"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Karunakaran", email = "karankarunakaran6@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "uvicorn>=0.54.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "psycopg>=3.1.0",
    "asyncpg>=0.32.0",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "pwdlib[argon2]>=0.3.1",
    "slowapi>=0.1.10",
    "redis>=8.1.0",
    "fastapi-limiter>=0.2.0",
]

[project.scripts]
polling = "polling:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
